<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Stepped delivery options for CBT-I</title><desc id="d">A stepped-care diagram from education and screening through validated digital programs, group or telehealth treatment, and specialist care.</desc><rect width="1200" height="700" fill="#fff"/><style>.b{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}.h{font:700 31px sans-serif;fill:#111827}.t{font:23px sans-serif;fill:#111827}.s{font:18px sans-serif;fill:#374151}</style><text x="600" y="48" text-anchor="middle" class="h">CBT-I delivery can be matched to need and risk</text><rect x="90" y="500" width="270" height="125" rx="14" class="b"/><text x="225" y="540" text-anchor="middle" class="t">Screen and educate</text><text x="225" y="575" text-anchor="middle" class="s">Not sleep hygiene alone</text><text x="225" y="603" text-anchor="middle" class="s">Check other sleep disorders</text><rect x="330" y="370" width="270" height="125" rx="14" class="b"/><text x="465" y="410" text-anchor="middle" class="t">Validated digital CBT-I</text><text x="465" y="445" text-anchor="middle" class="s">Automated or supported</text><text x="465" y="473" text-anchor="middle" class="s">Monitor engagement</text><rect x="570" y="240" width="270" height="125" rx="14" class="b"/><text x="705" y="280" text-anchor="middle" class="t">Group or telehealth</text><text x="705" y="315" text-anchor="middle" class="s">More clinician contact</text><text x="705" y="343" text-anchor="middle" class="s">Adapt components</text><rect x="810" y="110" width="300" height="125" rx="14" class="b"/><text x="960" y="150" text-anchor="middle" class="t">Behavioral sleep specialist</text><text x="960" y="185" text-anchor="middle" class="s">Complex comorbidity or nonresponse</text><text x="960" y="213" text-anchor="middle" class="s">Coordinate medical care</text><path d="M320 500 L390 495 L390 370" stroke="#374151" stroke-width="4" fill="none"/><path d="M560 370 L630 365 L630 240" stroke="#374151" stroke-width="4" fill="none"/><path d="M800 240 L870 235 L870 110" stroke="#374151" stroke-width="4" fill="none"/><text x="600" y="665" text-anchor="middle" class="s">Move up when risk, diagnostic uncertainty, treatment complexity, or nonresponse increases.</text></svg>