<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Evidence gap for CBT-I and DORA combination therapy</title><desc>Strong separate evidence columns for CBT-I and DORAs do not establish combination superiority without direct trials.</desc><rect width="1200" height="630" fill="white"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Separate evidence does not prove combination synergy</text><g font-family="Arial"><rect x="80" y="130" width="360" height="330" rx="26" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="260" y="190" text-anchor="middle" font-size="32" font-weight="700">CBT-I evidence</text><text x="260" y="250" text-anchor="middle" font-size="22">guidelines</text><text x="260" y="292" text-anchor="middle" font-size="22">randomized trials</text><text x="260" y="334" text-anchor="middle" font-size="22">durable behavioral skills</text><rect x="760" y="130" width="360" height="330" rx="26" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="940" y="190" text-anchor="middle" font-size="32" font-weight="700">DORA evidence</text><text x="940" y="250" text-anchor="middle" font-size="22">placebo-controlled trials</text><text x="940" y="292" text-anchor="middle" font-size="22">product-specific labels</text><text x="940" y="334" text-anchor="middle" font-size="22">drug-specific safety</text><rect x="485" y="205" width="230" height="180" rx="25" fill="#fff7ed" stroke="#9a3412" stroke-width="4"/><text x="600" y="260" text-anchor="middle" font-size="28" font-weight="700">Direct gap</text><text x="600" y="305" text-anchor="middle" font-size="20">No identified completed</text><text x="600" y="335" text-anchor="middle" font-size="20">combination superiority trial</text><text x="600" y="525" text-anchor="middle" font-size="25" font-weight="700">Needed: CBT-I alone vs DORA alone vs combination</text></g></svg>