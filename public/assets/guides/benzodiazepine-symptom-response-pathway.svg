<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Benzodiazepine taper symptom-response pathway</title><desc id="d">A decision pathway showing assessment, urgent red flags, holding or slowing a taper, smaller reductions, and limited circumstances for returning to the previous dose.</desc>
<rect width="1200" height="720" fill="#ffffff"/><style>.b{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}.h{font:700 31px sans-serif;fill:#111827}.t{font:23px sans-serif;fill:#111827}.s{font:19px sans-serif;fill:#374151}.a{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
<text x="600" y="48" text-anchor="middle" class="h">Symptoms after a benzodiazepine dose reduction</text>
<rect x="390" y="80" width="420" height="92" rx="16" class="b"/><text x="600" y="118" text-anchor="middle" class="t">Record dose, timing, symptoms, function</text><text x="600" y="150" text-anchor="middle" class="s">Assess withdrawal, recurrence, interaction, or new illness</text>
<path d="M600 172 V220" class="a"/><rect x="70" y="230" width="470" height="110" rx="16" class="b"/><text x="305" y="268" text-anchor="middle" class="t">Seizure, delirium, psychosis, severe instability?</text><text x="305" y="303" text-anchor="middle" class="s">Urgent local medical assessment</text>
<rect x="660" y="230" width="470" height="110" rx="16" class="b"/><text x="895" y="268" text-anchor="middle" class="t">No immediate red flag</text><text x="895" y="303" text-anchor="middle" class="s">Review symptom severity and trajectory</text>
<path d="M600 220 H305 V230" class="a"/><path d="M600 220 H895 V230" class="a"/>
<path d="M895 340 V390" class="a"/><rect x="680" y="400" width="430" height="112" rx="16" class="b"/><text x="895" y="438" text-anchor="middle" class="t">Usually first: pause, slow, or reduce less</text><text x="895" y="474" text-anchor="middle" class="s">Monitor until stable before the next change</text>
<path d="M895 512 V562" class="a"/><rect x="680" y="572" width="430" height="112" rx="16" class="b"/><text x="895" y="610" text-anchor="middle" class="t">If symptoms remain intolerable</text><text x="895" y="646" text-anchor="middle" class="s">Previous dose may be considered in limited cases</text>
<rect x="70" y="400" width="470" height="284" rx="16" class="b"/><text x="305" y="438" text-anchor="middle" class="t">What the evidence does not establish</text><text x="105" y="480" class="s">• “Push through” every symptom</text><text x="105" y="518" class="s">• One schedule for every patient</text><text x="105" y="556" class="s">• A rule of “previous dose minus 5–10%”</text><text x="105" y="594" class="s">• A guaranteed recovery timeline</text><text x="105" y="632" class="s">• Unsupervised repeated dose changes</text>
</svg>