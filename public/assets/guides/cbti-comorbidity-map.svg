<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">CBT-I comorbidity map</title><desc id="d">A map showing that CBT-I treats insomnia while other conditions such as sleep apnea, pain, PTSD, bipolar disorder, menopause symptoms, and medication withdrawal require parallel care or adaptation.</desc><rect width="1200" height="760" fill="#fff"/><style>.b{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}.h{font:700 31px sans-serif;fill:#111827}.t{font:22px sans-serif;fill:#111827}.s{font:18px sans-serif;fill:#374151}.a{stroke:#4b5563;stroke-width:2.5}</style><text x="600" y="45" text-anchor="middle" class="h">CBT-I treats insomnia; parallel problems still need parallel care</text><circle cx="600" cy="370" r="130" class="b"/><text x="600" y="350" text-anchor="middle" class="t">CBT-I</text><text x="600" y="385" text-anchor="middle" class="s">sleep mechanisms</text><text x="600" y="413" text-anchor="middle" class="s">and daytime function</text>
<g><rect x="60" y="105" width="300" height="100" rx="14" class="b"/><text x="210" y="145" text-anchor="middle" class="t">Sleep apnea</text><text x="210" y="177" text-anchor="middle" class="s">PAP or other OSA treatment</text><path d="M360 190 L500 300" class="a"/></g><g><rect x="840" y="105" width="300" height="100" rx="14" class="b"/><text x="990" y="145" text-anchor="middle" class="t">Chronic pain</text><text x="990" y="177" text-anchor="middle" class="s">Sleep benefit ≠ large pain relief</text><path d="M840 190 L700 300" class="a"/></g><g><rect x="60" y="330" width="300" height="100" rx="14" class="b"/><text x="210" y="370" text-anchor="middle" class="t">PTSD and nightmares</text><text x="210" y="402" text-anchor="middle" class="s">Trauma care; consider IRT</text><path d="M360 380 L470 380" class="a"/></g><g><rect x="840" y="330" width="300" height="100" rx="14" class="b"/><text x="990" y="370" text-anchor="middle" class="t">Bipolar disorder</text><text x="990" y="402" text-anchor="middle" class="s">Adapt sleep window; monitor mood</text><path d="M840 380 L730 380" class="a"/></g><g><rect x="60" y="555" width="300" height="100" rx="14" class="b"/><text x="210" y="595" text-anchor="middle" class="t">Menopause symptoms</text><text x="210" y="627" text-anchor="middle" class="s">Treat hot flashes when needed</text><path d="M360 570 L500 455" class="a"/></g><g><rect x="840" y="555" width="300" height="100" rx="14" class="b"/><text x="990" y="595" text-anchor="middle" class="t">Medication reduction</text><text x="990" y="627" text-anchor="middle" class="s">Do not replace taper safety</text><path d="M840 570 L700 455" class="a"/></g></svg>