<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>CBT-I sleep-window safety pathway</title><desc>Assess risk, choose restriction or compression, monitor function, and adapt or escalate.</desc><rect width="1200" height="630" fill="white"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">A sleep window is calibrated, not endured</text><g font-family="Arial"><rect x="60" y="135" width="240" height="150" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="180" y="185" text-anchor="middle" font-size="26" font-weight="700">1. Assess</text><text x="180" y="225" text-anchor="middle" font-size="20">diary, apnea, mood,</text><text x="180" y="255" text-anchor="middle" font-size="20">seizure, driving, falls</text><rect x="355" y="135" width="240" height="150" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="475" y="185" text-anchor="middle" font-size="26" font-weight="700">2. Choose</text><text x="475" y="225" text-anchor="middle" font-size="20">sleep restriction or</text><text x="475" y="255" text-anchor="middle" font-size="20">gradual compression</text><rect x="650" y="135" width="240" height="150" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="770" y="185" text-anchor="middle" font-size="26" font-weight="700">3. Monitor</text><text x="770" y="225" text-anchor="middle" font-size="20">sleepiness, function,</text><text x="770" y="255" text-anchor="middle" font-size="20">mood and safety</text><rect x="945" y="135" width="200" height="150" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><text x="1045" y="185" text-anchor="middle" font-size="26" font-weight="700">4. Adapt</text><text x="1045" y="225" text-anchor="middle" font-size="20">expand, compress,</text><text x="1045" y="255" text-anchor="middle" font-size="20">pause or refer</text><path d="M300 210H345M595 210H640M890 210H935" stroke="#111827" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs><rect x="180" y="365" width="840" height="155" rx="24" fill="#fff7ed" stroke="#9a3412" stroke-width="3"/><text x="600" y="415" text-anchor="middle" font-size="26" font-weight="700">Urgent assessment overrides the routine protocol</text><text x="600" y="460" text-anchor="middle" font-size="21">seizure • mania • psychosis • immediate self-harm risk</text><text x="600" y="495" text-anchor="middle" font-size="21">breathing compromise • syncope • unsafe driving or falls</text></g></svg>