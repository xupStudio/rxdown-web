<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>CBT-I adaptations for special populations</title><desc>Core CBT-I components are surrounded by pregnancy, adolescence, bipolar, apnea, pain, and older adult adaptations.</desc><rect width="1200" height="630" fill="white"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Keep the core; adapt the delivery and safety rules</text><circle cx="600" cy="330" r="135" fill="#f1f5f9" stroke="#111827" stroke-width="4"/><text x="600" y="300" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700">CBT-I core</text><text x="600" y="342" text-anchor="middle" font-family="Arial" font-size="21">stimulus control</text><text x="600" y="374" text-anchor="middle" font-family="Arial" font-size="21">sleep window • cognition</text><g font-family="Arial" font-size="22" font-weight="700"><rect x="70" y="145" width="250" height="90" rx="18" fill="#f8fafc" stroke="#334155"/><text x="195" y="198" text-anchor="middle">Pregnancy/postpartum</text><rect x="70" y="410" width="250" height="90" rx="18" fill="#f8fafc" stroke="#334155"/><text x="195" y="463" text-anchor="middle">Adolescence/school</text><rect x="880" y="145" width="250" height="90" rx="18" fill="#f8fafc" stroke="#334155"/><text x="1005" y="198" text-anchor="middle">Bipolar/seizure risk</text><rect x="880" y="410" width="250" height="90" rx="18" fill="#f8fafc" stroke="#334155"/><text x="1005" y="463" text-anchor="middle">Apnea/pain/falls</text></g><g stroke="#64748b" stroke-width="4"><line x1="320" y1="190" x2="480" y2="270"/><line x1="320" y1="455" x2="480" y2="390"/><line x1="880" y1="190" x2="720" y2="270"/><line x1="880" y1="455" x2="720" y2="390"/></g></svg>