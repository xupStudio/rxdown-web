<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Sleep hygiene compared with CBT-I</title><desc>Two columns show supportive sleep habits versus a structured multicomponent insomnia treatment.</desc><rect width="1200" height="630" fill="white"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">Sleep hygiene is supportive; CBT-I is treatment</text><rect x="70" y="120" width="490" height="420" rx="24" fill="#eef3f7" stroke="#334155" stroke-width="3"/><text x="315" y="175" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Sleep hygiene</text><text x="110" y="235" font-family="Arial" font-size="24">• caffeine, alcohol, nicotine</text><text x="110" y="285" font-family="Arial" font-size="24">• light, noise, temperature</text><text x="110" y="335" font-family="Arial" font-size="24">• exercise and timing habits</text><text x="110" y="405" font-family="Arial" font-size="22" font-weight="700">Useful support</text><text x="110" y="445" font-family="Arial" font-size="22">Not sufficient alone for chronic insomnia</text><rect x="640" y="120" width="490" height="420" rx="24" fill="#f4f6f8" stroke="#111827" stroke-width="3"/><text x="885" y="175" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Multicomponent CBT-I</text><text x="680" y="235" font-family="Arial" font-size="24">• assessment and sleep diary</text><text x="680" y="285" font-family="Arial" font-size="24">• stimulus control</text><text x="680" y="335" font-family="Arial" font-size="24">• calibrated sleep window</text><text x="680" y="385" font-family="Arial" font-size="24">• cognitive therapy</text><text x="680" y="435" font-family="Arial" font-size="24">• relapse prevention</text><text x="680" y="495" font-family="Arial" font-size="22" font-weight="700">First-line guideline treatment</text></svg>