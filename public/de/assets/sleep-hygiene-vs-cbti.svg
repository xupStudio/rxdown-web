<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Unterschied zwischen Schlafhygiene und CBT-I</title><desc id="desc">Vereinfachte Entscheidungshilfe; kein individueller Behandlungsplan.</desc>
<rect width="1200" height="700" fill="#fff"/><style>.h{font:700 30px sans-serif;fill:#111827}.th{font:700 26px sans-serif;fill:#111827}.t{font:21px sans-serif;fill:#111827}.box{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}</style>
<text x="600" y="62" text-anchor="middle" class="h"><tspan x="600" y="62.0">Unterschied zwischen Schlafhygiene und CBT-I</tspan></text>
<rect x="70" y="145" width="490" height="430" rx="24" class="box"/><rect x="640" y="145" width="490" height="430" rx="24" class="box"/>
<text x="315" y="205" text-anchor="middle" class="th"><tspan x="315" y="205.0">Schlafhygiene</tspan></text><text x="315" y="280" text-anchor="middle" class="t"><tspan x="315" y="280.0">Unterstützende Gewohnheiten</tspan></text><text x="315" y="365" text-anchor="middle" class="t"><tspan x="315" y="365.0">Kann Schlafbarrieren verringern</tspan></text><text x="315" y="465" text-anchor="middle" class="t"><tspan x="315" y="452.0">Allein meist keine ausreichende</tspan><tspan x="315" y="478.0">Behandlung chronischer Insomnie</tspan></text>
<text x="885" y="205" text-anchor="middle" class="th"><tspan x="885" y="205.0">Mehrkomponenten-CBT-I</tspan></text><text x="885" y="315" text-anchor="middle" class="t"><tspan x="885" y="302.0">Erstlinientherapie, die</tspan><tspan x="885" y="328.0">Insomniemechanismen gezielt behandelt</tspan></text>
<text x="600" y="635" text-anchor="middle" class="t"><tspan x="600" y="635.0">Vereinfachte Entscheidungshilfe; kein individueller Behandlungsplan.</tspan></text>
</svg>
