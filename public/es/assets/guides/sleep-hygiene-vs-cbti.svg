<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Diferencia entre higiene del sueño y CBT-I</title><desc id="desc">Ayuda visual simplificada; no es un plan de tratamiento individualizado.</desc>
<rect width="1200" height="700" fill="#fff"/><style>.h{font:700 30px sans-serif;fill:#111827}.th{font:700 26px sans-serif;fill:#111827}.t{font:21px sans-serif;fill:#111827}.box{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}</style>
<text x="600" y="62" text-anchor="middle" class="h"><tspan x="600" y="62.0">Diferencia entre higiene del sueño y CBT-I</tspan></text>
<rect x="70" y="145" width="490" height="430" rx="24" class="box"/><rect x="640" y="145" width="490" height="430" rx="24" class="box"/>
<text x="315" y="205" text-anchor="middle" class="th"><tspan x="315" y="205.0">Higiene del sueño</tspan></text><text x="315" y="280" text-anchor="middle" class="t"><tspan x="315" y="280.0">Hábitos de apoyo</tspan></text><text x="315" y="365" text-anchor="middle" class="t"><tspan x="315" y="365.0">Puede reducir barreras para dormir</tspan></text><text x="315" y="465" text-anchor="middle" class="t"><tspan x="315" y="452.0">Por sí sola suele ser insuficiente</tspan><tspan x="315" y="478.0">para el insomnio crónico</tspan></text>
<text x="885" y="205" text-anchor="middle" class="th"><tspan x="885" y="205.0">CBT-I multicomponente</tspan></text><text x="885" y="315" text-anchor="middle" class="t"><tspan x="885" y="302.0">Tratamiento de primera línea dirigido</tspan><tspan x="885" y="328.0">a los mecanismos del insomnio</tspan></text>
<text x="600" y="635" text-anchor="middle" class="t"><tspan x="600" y="635.0">Ayuda visual simplificada; no es un plan de tratamiento individualizado.</tspan></text>
</svg>
