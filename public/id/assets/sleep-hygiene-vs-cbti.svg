<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Perbedaan kebersihan tidur dan CBT-I</title><desc id="desc">Alat bantu keputusan yang disederhanakan; bukan rencana terapi individual.</desc>
<rect width="1200" height="700" fill="#fff"/><style>.h{font:700 30px sans-serif;fill:#111827}.th{font:700 26px sans-serif;fill:#111827}.t{font:21px sans-serif;fill:#111827}.box{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}</style>
<text x="600" y="62" text-anchor="middle" class="h"><tspan x="600" y="62.0">Perbedaan kebersihan tidur dan CBT-I</tspan></text>
<rect x="70" y="145" width="490" height="430" rx="24" class="box"/><rect x="640" y="145" width="490" height="430" rx="24" class="box"/>
<text x="315" y="205" text-anchor="middle" class="th"><tspan x="315" y="205.0">Kebersihan tidur</tspan></text><text x="315" y="280" text-anchor="middle" class="t"><tspan x="315" y="280.0">Kebiasaan pendukung</tspan></text><text x="315" y="365" text-anchor="middle" class="t"><tspan x="315" y="365.0">Dapat mengurangi hambatan tidur</tspan></text><text x="315" y="465" text-anchor="middle" class="t"><tspan x="315" y="452.0">Biasanya tidak cukup sendiri untuk</tspan><tspan x="315" y="478.0">insomnia kronis</tspan></text>
<text x="885" y="205" text-anchor="middle" class="th"><tspan x="885" y="205.0">CBT-I multikomponen</tspan></text><text x="885" y="315" text-anchor="middle" class="t"><tspan x="885" y="302.0">Terapi lini pertama yang menargetkan</tspan><tspan x="885" y="328.0">mekanisme insomnia</tspan></text>
<text x="600" y="635" text-anchor="middle" class="t"><tspan x="600" y="635.0">Alat bantu keputusan yang disederhanakan; bukan rencana terapi individual.</tspan></text>
</svg>
