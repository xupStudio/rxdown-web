<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">がん診療における不眠の評価と対応経路</title>
<desc id="desc">簡略化した意思決定支援図であり、個別の治療計画ではありません。</desc>
<metadata>Localized language-neutral schematic derived from cancer-insomnia-pathway.svg; visible labels are simplified and the English source figure is retained separately for audit.</metadata>
<rect width="1200" height="700" fill="#ffffff"/>
<style>.box{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}.num{fill:#e5e7eb;stroke:#374151;stroke-width:2}.ntext{font:700 22px sans-serif;fill:#111827}.title{font:700 30px sans-serif;fill:#111827}.label{font:600 20px sans-serif;fill:#111827}.foot{font:18px sans-serif;fill:#374151}.arrow{stroke:#4b5563;stroke-width:3;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker></defs>
<text x="600" y="55" text-anchor="middle" class="title"><tspan x="600" y="55">がん診療における不眠の評価と対応経路</tspan></text>
<rect x="45" y="180" width="190" height="150" rx="20" class="box"/><circle cx="140" cy="218" r="22" class="num"/><text x="140" y="226" text-anchor="middle" class="ntext">1</text><text x="140" y="282" text-anchor="middle" class="label"><tspan x="140" y="282.0">背景を評価</tspan></text><path d="M240 255 H265" class="arrow"/><rect x="275" y="180" width="190" height="150" rx="20" class="box"/><circle cx="370" cy="218" r="22" class="num"/><text x="370" y="226" text-anchor="middle" class="ntext">2</text><text x="370" y="282" text-anchor="middle" class="label"><tspan x="370" y="282.0">安全上のリスクを確認</tspan></text><path d="M470 255 H495" class="arrow"/><rect x="505" y="180" width="190" height="150" rx="20" class="box"/><circle cx="600" cy="218" r="22" class="num"/><text x="600" y="226" text-anchor="middle" class="ntext">3</text><text x="600" y="282" text-anchor="middle" class="label"><tspan x="600" y="282.0">次の対応を選択</tspan></text><path d="M700 255 H725" class="arrow"/><rect x="735" y="180" width="190" height="150" rx="20" class="box"/><circle cx="830" cy="218" r="22" class="num"/><text x="830" y="226" text-anchor="middle" class="ntext">4</text><text x="830" y="282" text-anchor="middle" class="label"><tspan x="830" y="282.0">記録して監視</tspan></text><path d="M930 255 H955" class="arrow"/><rect x="965" y="180" width="190" height="150" rx="20" class="box"/><circle cx="1060" cy="218" r="22" class="num"/><text x="1060" y="226" text-anchor="middle" class="ntext">5</text><text x="1060" y="282" text-anchor="middle" class="label"><tspan x="1060" y="282.0">再評価して調整</tspan></text>
<text x="600" y="555" text-anchor="middle" class="foot"><tspan x="600" y="555.0">簡略化した意思決定支援図であり、個別の治療計画ではありません。</tspan></text>
</svg>
