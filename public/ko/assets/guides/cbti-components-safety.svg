<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">CBT-I 구성요소와 안전 조정</title>
<desc id="desc">단순화한 의사결정 보조 도표이며 개인별 치료 계획이 아닙니다.</desc>
<metadata>Localized language-neutral schematic derived from cbti-components-safety.svg; visible labels are simplified and the English source figure is retained separately for audit.</metadata>
