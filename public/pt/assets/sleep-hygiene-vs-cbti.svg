<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Diferença entre higiene do sono e CBT-I</title><desc id="desc">Auxílio visual simplificado; não é um plano de tratamento individualizado.</desc>
<rect width="1200" height="700" fill="#fff"/><style>.h{font:700 30px sans-serif;fill:#111827}.th{font:700 26px sans-serif;fill:#111827}.t{font:21px sans-serif;fill:#111827}.box{fill:#f5f7fa;stroke:#1f2937;stroke-width:2}</style>
<text x="600" y="62" text-anchor="middle" class="h"><tspan x="600" y="62.0">Diferença entre higiene do sono e CBT-I</tspan></text>
<rect x="70" y="145" width="490" height="430" rx="24" class="box"/><rect x="640" y="145" width="490" height="430" rx="24" class="box"/>
<text x="315" y="205" text-anchor="middle" class="th"><tspan x="315" y="205.0">Higiene do sono</tspan></text><text x="315" y="280" text-anchor="middle" class="t"><tspan x="315" y="280.0">Hábitos de apoio</tspan></text><text x="315" y="365" text-anchor="middle" class="t"><tspan x="315" y="365.0">Pode reduzir barreiras ao sono</tspan></text><text x="315" y="465" text-anchor="middle" class="t"><tspan x="315" y="452.0">Isoladamente, costuma ser insuficiente</tspan><tspan x="315" y="478.0">para a insónia crónica</tspan></text>
<text x="885" y="205" text-anchor="middle" class="th"><tspan x="885" y="205.0">CBT-I multicomponente</tspan></text><text x="885" y="315" text-anchor="middle" class="t"><tspan x="885" y="302.0">Tratamento de primeira linha dirigido</tspan><tspan x="885" y="328.0">aos mecanismos da insónia</tspan></text>
<text x="600" y="635" text-anchor="middle" class="t"><tspan x="600" y="635.0">Auxílio visual simplificado; não é um plano de tratamento individualizado.</tspan></text>
</svg>
